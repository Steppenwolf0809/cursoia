<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="escena-4-template">
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; color: var(--texto); }
        #escena-4-contenido { position: absolute; inset: 0; }
        #escena-4-larga {
          position: absolute; left: 192px; top: 300px; white-space: pre;
          font-family: 'Inter'; font-weight: 700; font-size: 120px; line-height: 1.05;
          letter-spacing: -0.02em; color: var(--texto);
        }
        #escena-4-fila-a { position: absolute; left: 192px; top: 300px; display: flex; gap: 16px; }
        #escena-4-fila-b { position: absolute; left: 192px; top: 420px; display: flex; gap: 12px; }
        .escena-4-tok {
          display: inline-block;
          font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 88px; line-height: 1;
          padding: 20px 26px; border-radius: 14px; color: var(--sobre-token); white-space: pre;
        }
        #escena-4-fila-b .escena-4-tok { font-size: 72px; padding: 16px 20px; }
        #escena-4-linea {
          position: absolute; left: 0; top: 279px; width: 6px; height: 170px;
          border-radius: 3px; background: var(--acento);
        }
        #escena-4-frase {
          position: absolute; left: 192px; top: 420px; white-space: pre;
          font-family: 'Inter'; font-weight: 400; font-size: 88px; line-height: 1.05; color: var(--texto);
        }
        #escena-4-cuenta-p {
          position: absolute; left: 192px; top: 600px; white-space: pre;
          font-family: 'Inter'; font-weight: 400; font-size: 56px; line-height: 1; color: var(--texto);
        }
        #escena-4-cuenta-t {
          position: absolute; left: 760px; top: 600px; white-space: pre;
          font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 56px; line-height: 1; color: var(--acento);
        }
      </style>
      <div id="root" data-composition-id="escena-4" data-width="1920" data-height="1080">
        <div id="escena-4-contenido">
          <div id="escena-4-larga" data-layout-allow-overlap>otorrinolaringólogo</div>
          <div id="escena-4-fila-a">
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-1)">ot</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-2)">orr</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-3)">inol</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-4)">aring</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-5)">ólogo</span>
          </div>
          <div id="escena-4-linea"></div>
          <div id="escena-4-frase" data-layout-allow-overlap>Mi ñaño vive en Guayaquil.</div>
          <div id="escena-4-fila-b">
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-1)">Mi</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-2)">ñ</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-3)">a</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-4)">ño</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-5)">vive</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-1)">en</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-2)">Gu</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-3)">aya</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-4)">quil</span>
            <span class="escena-4-tok" data-layout-allow-overlap style="background: var(--token-5)">.</span>
          </div>
          <div id="escena-4-cuenta-p">5 palabras</div>
          <div id="escena-4-cuenta-t">10 tokens</div>
        </div>
      </div>
      <script>
        (() => {
          const D = 15.738;
          const W = {"Otorrinolaringólogo": 4.86, "corta": 6.65, "Y": 8.95, "palabras": 12.6, "diez": 14.0, "tokens": 14.39}; // anclas 4 Otorrinolaringólogo corta Y palabras diez tokens
          const tl = gsap.timeline({ paused: true });

          // Parte A. La palabra larga entra desde la derecha.
          tl.fromTo("#escena-4-larga", { x: 1700, opacity: 1 },
            { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, W["Otorrinolaringólogo"] - 0.3);

          // La línea barre en 0,6 s; la palabra se apaga y cada pedazo aparece cuando la línea lo cruza.
          const CH = 0.6 * 88, PAD = 26, GAP = 16; // IBM Plex Mono: avance 0,6 em
          const PIEZAS = ["ot", "orr", "inol", "aring", "ólogo"];
          const X0 = 150, X1 = 1560, BARRE = 0.6;
          tl.fromTo("#escena-4-linea", { x: X0, opacity: 0 }, { x: X0, opacity: 1, duration: 0.15, ease: "power1.out" }, W.corta - 0.15);
          tl.fromTo("#escena-4-linea", { x: X0 },
            { x: X1, duration: BARRE, ease: "none", immediateRender: false }, W.corta);
          tl.fromTo("#escena-4-linea", { opacity: 1 },
            { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false }, W.corta + BARRE);
          tl.fromTo("#escena-4-larga", { opacity: 1 },
            { opacity: 0, duration: BARRE, ease: "none", immediateRender: false }, W.corta);
          let borde = 192;
          const ENTRA = PIEZAS.map((txt) => {
            const t = W.corta + BARRE * (borde - X0) / (X1 - X0); // cuando la línea cruza su borde izquierdo
            borde += txt.length * CH + 2 * PAD + GAP;
            return t;
          });
          document.querySelectorAll("#escena-4-fila-a .escena-4-tok").forEach((el, k) => {
            tl.fromTo(el, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, ENTRA[k]);
          });

          // Parte B. La fila A sube y se atenúa; entra la frase.
          tl.fromTo("#escena-4-fila-a", { y: 0, opacity: 1 },
            { y: -150, opacity: 0.45, duration: 0.5, ease: "power2.inOut" }, W.Y);
          tl.fromTo("#escena-4-frase", { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, W.Y + 0.3);
          tl.fromTo("#escena-4-cuenta-p", { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, W.palabras);

          // «diez»: la frase se apaga y en su lugar se abre la fila de 10 bloques desde el centro.
          tl.fromTo("#escena-4-frase", { opacity: 1 },
            { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, W.diez);
          tl.fromTo("#escena-4-fila-b .escena-4-tok", { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)", stagger: { each: 0.05, from: "center" } }, W.diez);
          tl.fromTo("#escena-4-cuenta-t", { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, W.tokens);

          tl.fromTo("#escena-4-contenido", { opacity: 1 },
            { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, D - 0.3);
          window.__timelines["escena-4"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
